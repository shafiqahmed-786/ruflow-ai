# Keliai su ~ yra išplečiami pagal macOS prisijungusio naudotojo namų katalogą.
paths:
  links_xlsx: ~/Desktop/TS_nuorodos.xlsx
  catalogs: ~/Desktop/Katalogai
  output: ~/Desktop/TS_rezultatai
  data: ./data

schedule_times:
  - "08:00"
  - "08:10"
  - "08:20"
  - "08:30"
  - "08:40"
  - "08:50"
  - "12:00"
  - "12:10"
  - "12:20"
  - "12:30"
  - "12:40"
  - "12:50"
  - "16:00"
  - "16:10"
  - "16:20"
  - "16:30"
  - "16:40"
  - "16:50"

request_timeout_seconds: 25
max_download_bytes: 52428800
ollama:
  enabled: true
  base_url: http://127.0.0.1:11434
  model: qwen3.5:4b
  num_ctx: 8192
  request_timeout_seconds: 90
  max_jobs_per_run: 12
  chunk_pages: 4
  chunk_max_chars: 18000
  retry_base_seconds: 60
web_search_enabled: true
playwright_enabled: true
model_search_enabled: true
max_web_searches_per_run: 3
max_web_downloads_per_run: 5
max_models_per_run: 3
max_model_pages_per_model: 4
