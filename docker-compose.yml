# docker-compose.yml
# CareerOS AI — single-command local deployment
# Usage:
#   cp .env.example .env   # fill in GEMINI_API_KEY
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: careeros_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: careeros_db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── ChromaDB ────────────────────────────────────────────────────────────────
  chroma:
    image: ghcr.io/chroma-core/chroma:0.4.24
    container_name: careeros_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros_backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      # Docker-internal DB hostnames override .env values
      MONGODB_URI:          mongodb://mongo:27017
      MONGODB_DB_NAME:      careeros_db
      CHROMA_HOST:          chroma
      CHROMA_PORT:          "8000"
      CHROMA_PERSIST_DIR:   /app/chroma_data
      EMBEDDING_CACHE_DIR:  /app/model_cache
      LOG_LEVEL:            INFO
      WORKERS:              "2"
      DEBUG:                "false"
    volumes:
      - chroma_data:/app/chroma_data
      - model_cache:/app/model_cache
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careeros_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Browser-side URL (must be reachable from user's machine)
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Server-side URL (internal Docker network)
      API_URL:             http://backend:8000
      NODE_ENV:            production
      PORT:                "3000"
      HOSTNAME:            "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  chroma_data:
  model_cache:
  backend_logs:
