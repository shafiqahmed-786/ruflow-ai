# docker-compose.yml
# CareerOS AI — single-command local deployment
#
# Usage:
#   cp .env.example .env          # fill in GEMINI_API_KEY
#   docker compose up --build
#
# Services: mongo (27017) · chroma (8001→8000) · backend (8080→8000) · frontend (3000)
# ---------------------------------------------------------------------------

version: "3.9"

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: careeros_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: careeros_db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chroma:
    image: ghcr.io/chroma-core/chroma:0.4.24
    container_name: careeros_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  # Build context is REPO ROOT so `backend/` is copied as a package.
  # PYTHONPATH=/app → `from backend.xxx` resolves to /app/backend/xxx.
  backend:
    build:
      context: .                      # repo root — required for backend.xxx imports
      dockerfile: backend/Dockerfile
    container_name: careeros_backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env                          # provides GEMINI_API_KEY at minimum
    environment:
      # Docker-internal hostnames override any .env values for DBs
      MONGODB_URI:         mongodb://mongo:27017
      MONGODB_DB_NAME:     careeros_db
      CHROMA_HOST:         chroma
      CHROMA_PORT:         "8000"
      CHROMA_PERSIST_DIR:  /app/chroma_data
      EMBEDDING_CACHE_DIR: /app/model_cache
      CORS_ORIGINS:        "http://localhost:3000"
      LOG_LEVEL:           INFO
      WORKERS:             "1"
      DEBUG:               "false"
    volumes:
      - chroma_data:/app/chroma_data
      - model_cache:/app/model_cache
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s              # allow time for embedding model warm-up
      retries: 5

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  # NEXT_PUBLIC_API_URL is baked at BUILD time by Next.js.
  # Pass it as a build arg so it is available during `next build`.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080   # browser-accessible backend
    container_name: careeros_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:  production
      PORT:      "3000"
      HOSTNAME:  "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  mongo_data:
  chroma_data:
  model_cache:
  backend_logs:
