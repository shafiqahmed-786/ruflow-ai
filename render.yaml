# render.yaml — CareerOS AI backend deployment
#
# Render runs from the repo root. PYTHONPATH is set to /opt/render/project/src
# so `from backend.xxx` resolves correctly.
#
# Required env vars to set manually in Render dashboard:
#   GEMINI_API_KEY  — from https://aistudio.google.com/apikey
#   MONGODB_URI     — MongoDB Atlas connection string
#
# All other vars have safe defaults below.

services:
  - type: web
    name: careeros-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_DB_NAME
        value: careeros_db
      - key: MODEL_STRONG
        value: gemini-2.0-flash
      - key: MODEL_FAST
        value: gemini-2.0-flash-lite
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: "1"
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: "8000"
